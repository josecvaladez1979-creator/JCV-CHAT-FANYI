    <text x="130" y="190" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="bold" fill="#7c3aed" text-anchor="middle">翻译 FĀNYÌ</text>
  </g>
  <!-- E2EE Shield badge on bottom-right -->
  <circle cx="390" cy="380" r="56" fill="#020617"/>
  <circle cx="390" cy="380" r="48" fill="url(#accent)"/>
  <path d="M 390,355 L 412,365 L 412,385 C 412,398 402,408 390,412 C 378,408 368,398 368,385 L 368,365 Z" fill="#ffffff"/>
