      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <g transform="translate(100, 110)">
    <!-- Chat Speech Bubble -->
    <path d="M 40,30 C 18,30 0,48 0,70 L 0,170 C 0,192 18,210 40,210 L 60,210 L 60,250 L 100,210 L 220,210 C 242,210 260,192 260,170 L 260,70 C 260,48 242,30 220,30 Z" fill="#ffffff" fill-opacity="0.95"/>
