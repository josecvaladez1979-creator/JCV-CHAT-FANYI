name: CI/CD — JCV CHAT FĀNYÌ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════
  # JOB 1: Calidad (typecheck + build)
  # ═══════════════════════════════════════
  quality:
    name: 🔍 Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  # ═══════════════════════════════════════
  # JOB 2: Deploy a Render (solo push a main)
  # ═══════════════════════════════════════
  deploy:
    name: 🚀 Deploy a Render
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "🚀 Disparando deploy en Render..."
          RESPONSE=$(curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "✅ Render respondió: $RESPONSE"

      - name: Esperar y verificar
        run: |
          sleep 60
          echo "⏳ Esperando 60s a que Render termine el build..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/api/siliconflow/status" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ API respondiendo correctamente"
          else
            echo "⚠️  API aún no responde (status: $STATUS). Render puede tardar 2-3 min."
          fi
