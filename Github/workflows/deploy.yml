name: CI/CD — JCV CHAT FĀNYÌ

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════
  # JOB 1: Calidad (corre en PRs y pushes)
  # ═══════════════════════════════════════════════
  quality:
    name: 🔍 Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Typecheck
        run: npm run lint

      - name: Build (Vite)
        run: npm run build
        env:
          NODE_ENV: production

  # ═══════════════════════════════════════════════
  # JOB 2: Deploy a producción (solo push a main)
  # ═══════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy a Producción
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy vía SSH + PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "🚀 Iniciando despliegue..."

            APP_DIR="${DEPLOY_DIR:-/var/www/jcv-chat-fānyì}"
            cd "$APP_DIR"

            echo "📥 Descargando últimos cambios..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Instalando dependencias de producción..."
            npm ci --omit=dev --no-audit --no-fund

            echo "🗄️  Generando cliente Prisma..."
            npx prisma generate

            echo "⚙️  Aplicando migraciones..."
            npx prisma migrate deploy

            echo "🔨 Construyendo frontend (Vite)..."
            npx vite build

            echo "♻️  Reiniciando aplicación con PM2..."
            if pm2 describe jcv-api > /dev/null 2>&1; then
              pm2 reload jcv-api --update-env
            else
              pm2 start server.ts \
                --name jcv-api \
                --interpreter tsx \
                --env production \
                --max-memory-restart 512M \
                --time
            fi

            pm2 save

            echo "✅ Deploy completado: $(date)"
            pm2 list

      - name: Verificar salud
        run: |
          sleep 5
          curl -fsS "${{ vars.PRODUCTION_URL }}/api/auth/users" > /dev/null \
            && echo "✅ API respondiendo" \
            || echo "⚠️  API no responde aún (puede tardar unos segundos)"

      - name: Notificar éxito
        if: success()
        run: echo "✅ Deploy exitoso del commit ${{ github.sha }}"
